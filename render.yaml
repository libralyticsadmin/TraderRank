services:
  - type: web
    name: traderrank
    env: node
    plan: starter
    region: singapore # Close to Asia-Pacific broker datacenters (IC Markets, XM, Exness)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: traderrank-storage
      mountPath: /var/data/traderrank
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/traderrank
      - key: META_API_TOKEN
        sync: false # Set securely in Render dashboard
      - key: ALLTICK_API_TOKEN
        sync: false
      - key: VAULT_MASTER_KEY
        generateValue: true
      # Operator email alerts (AlertService). Set in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      # Dedicated platform MetaApi account for market data (never a user's account)
      - key: META_API_MARKET_DATA_ACCOUNT_ID
        sync: false
      - key: ADMIN_API_KEY
        sync: false
